name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: viva-mode-windows
          - os: macos-latest
            script: dist:mac
            artifact: viva-mode-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run verify
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Viva Mode — a local VTU CSE lab-viva practice room built with the Presage SmartSpectra SDK.

            Download the installer for your platform:
            - Windows: the .exe below
            - macOS: the .dmg below (unsigned if no signing certificate was available; right-click → Open on first launch)

            You also need a free Presage API key from https://physiology.presagetech.com. Paste it on the consent screen, set PRESAGE_API_KEY, or choose Practice without signals to run with no camera and no key.

            Practice/wellness tool. Not medical advice. SmartSpectra metrics are not FDA-cleared.
